<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="AAPNA ATS - Modern Applicant Tracking System for streamlined recruitment process automation" />
    <meta name="keywords" content="ATS, Recruitment, Hiring, Applicant Tracking, HR, AAPNA" />
    <meta name="author" content="AAPNA" />
    <meta name="theme-color" content="#4f2fb8" />

    <!-- Anti-FOUC: apply the saved theme before first paint. Default is LIGHT;
         the OS preference is honored only when the user explicitly chose "system". -->
    <script>
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem('ats_theme');
        } catch (e) {
          /* storage unavailable (private mode) — fall through to light */
        }
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        var el = document.documentElement;
        el.setAttribute('data-theme', theme);
        el.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0d0b16' : '#4f2fb8');
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="AAPNA ATS - Recruitment Process Automation" />
    <meta property="og:description" content="Modern Applicant Tracking System for streamlined recruitment" />
    <meta property="og:type" content="website" />

    <!-- Favicon — the AAPNA rotor mark knocked out of a brand-violet tile.
         Generated from the same path data as src/components/common/AapnaLogo.jsx,
         so the tab icon and the in-app logo cannot drift apart. A tile rather than
         the bare mark because the outline blades disappear at 16px and the mark is
         invisible against a dark tab strip. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Google Fonts: Inter + Sora + DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <title>AAPNA ATS - Recruitment Process Automation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
