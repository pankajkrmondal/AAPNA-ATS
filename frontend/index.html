<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="AAPNA ATS - Modern Applicant Tracking System for streamlined recruitment process automation" />
    <meta name="keywords" content="ATS, Recruitment, Hiring, Applicant Tracking, HR, AAPNA" />
    <meta name="author" content="AAPNA" />
    <meta name="theme-color" content="#7a922e" />

    <!-- Anti-FOUC: apply the saved theme before first paint. Default is DARK;
         the OS preference is honored only when the user explicitly chose "system".
         Keep in step with getInitialMode() in src/context/ThemeContext.jsx. -->
    <script>
      (function () {
        var mode = null;
        try {
          // One-time migration: the old ThemeProvider persisted the 'light'
          // default on every load, so a stored 'light' is not a real choice.
          // Drop it once so everyone lands on the new dark default; only an
          // explicit toggle is persisted from here on.
          if (localStorage.getItem('ats_theme_default') !== 'dark') {
            if (localStorage.getItem('ats_theme') === 'light') localStorage.removeItem('ats_theme');
            localStorage.setItem('ats_theme_default', 'dark');
          }
          mode = localStorage.getItem('ats_theme');
        } catch (e) {
          /* storage unavailable (private mode) — fall through to dark */
        }
        // Sign-in pages and public token-link pages (candidate / approver /
        // interviewer forms) are always light — keep in step with the
        // ForceLight routes in App.jsx.
        var path = window.location.pathname;
        var publicPage =
          /^\/(login|admin\/login|forgot-password|reset-password)\/?$/.test(path) ||
          /^\/(missing-jd-upload|mrf-submit|scorecard\/|documents\/)/.test(path) ||
          /^\/mrf\/[^/]+\/approve/.test(path);
        var dark =
          !publicPage &&
          (mode === 'system'
            ? !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
            : mode !== 'light');
        var theme = dark ? 'dark' : 'light';
        var el = document.documentElement;
        el.setAttribute('data-theme', theme);
        el.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0a0e0c' : '#7a922e');
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="AAPNA ATS - Recruitment Process Automation" />
    <meta property="og:description" content="Modern Applicant Tracking System for streamlined recruitment" />
    <meta property="og:type" content="website" />

    <!-- Favicon. Points at a real file in public/ — the old /vite.svg only ever
         resolved because the Vite dev server serves its own copy; no such file is
         emitted into dist, so every deployed environment fell through to the SPA
         catch-all, received index.html as "the icon", and showed the default globe. -->
    <link rel="icon" type="image/jpeg" href="/brand/aapna-mark.jpg" />
    <link rel="apple-touch-icon" href="/brand/aapna-mark.jpg" />

    <!-- Google Fonts: Inter + Sora + DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <title>AAPNA ATS - Recruitment Process Automation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
